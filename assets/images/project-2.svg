<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" rx="16"/>

  <!-- Decorative glow circles -->
  <circle cx="200" cy="120" r="140" fill="#3b82f6" opacity="0.18" filter="url(#glow2)"/>
  <circle cx="620" cy="320" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow2)"/>

  <!-- Mobile Phone Mockup 1 -->
  <g transform="translate(180, 45)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="190" height="360" rx="32" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <!-- Speaker notch -->
    <rect x="65" y="10" width="60" height="6" rx="3" fill="#1e293b"/>
    
    <!-- App Screen -->
    <!-- Top Header -->
    <text x="24" y="44" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Total Balance</text>
    <text x="24" y="68" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold">$48,250.80</text>
    <rect x="125" y="52" width="45" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="133" y="65" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">+14.2%</text>

    <!-- Credit Card -->
    <rect x="18" y="85" width="154" height="95" rx="14" fill="url(#cardGrad2)"/>
    <circle cx="145" cy="105" r="12" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="132" cy="105" r="12" fill="#ffffff" fill-opacity="0.25"/>
    <text x="32" y="115" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">PayFlow Pro</text>
    <text x="32" y="145" fill="#e2e8f0" font-family="monospace" font-size="11">•••• 8924</text>
    <text x="32" y="165" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">VALID 09/28</text>

    <!-- Quick Actions -->
    <rect x="18" y="195" width="46" height="42" rx="10" fill="#1e293b"/>
    <text x="31" y="220" fill="#06b6d4" font-size="14">↑</text>
    <rect x="72" y="195" width="46" height="42" rx="10" fill="#1e293b"/>
    <text x="85" y="220" fill="#10b981" font-size="14">↓</text>
    <rect x="126" y="195" width="46" height="42" rx="10" fill="#1e293b"/>
    <text x="139" y="220" fill="#f59e0b" font-size="14">⇄</text>

    <!-- Transaction List -->
    <rect x="18" y="250" width="154" height="38" rx="8" fill="#131d31"/>
    <circle cx="34" cy="269" r="10" fill="#3b82f6"/>
    <text x="50" y="266" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Apple Store</text>
    <text x="50" y="278" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="8">Gadgets &amp; Tech</text>
    <text x="135" y="272" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">-$129</text>

    <rect x="18" y="296" width="154" height="38" rx="8" fill="#131d31"/>
    <circle cx="34" cy="315" r="10" fill="#10b981"/>
    <text x="50" y="312" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Salary Payout</text>
    <text x="50" y="324" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="8">Direct Deposit</text>
    <text x="130" y="318" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">+$4,200</text>
  </g>

  <!-- Mobile Phone Mockup 2 (Shifted Perspective) -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="190" height="330" rx="30" fill="#0b111e" stroke="#475569" stroke-width="2.5"/>
    <rect x="65" y="10" width="60" height="5" rx="2.5" fill="#1e293b"/>
    
    <!-- Crypto Chart Card -->
    <text x="24" y="44" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">Portfolio Growth</text>
    <text x="24" y="68" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">+32.6%</text>

    <!-- Curve chart -->
    <path d="M 25 140 Q 60 90, 95 120 T 165 75" fill="none" stroke="url(#accentGrad2)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 25 140 Q 60 90, 95 120 T 165 75 L 165 160 L 25 160 Z" fill="url(#accentGrad2)" opacity="0.12"/>
    <circle cx="165" cy="75" r="5" fill="#10b981"/>

    <!-- Asset list -->
    <rect x="18" y="180" width="154" height="38" rx="8" fill="#17223b"/>
    <circle cx="34" cy="199" r="10" fill="#f59e0b"/>
    <text x="50" y="196" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Bitcoin</text>
    <text x="50" y="208" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="8">BTC / USD</text>
    <text x="128" y="202" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">+4.5%</text>

    <rect x="18" y="226" width="154" height="38" rx="8" fill="#17223b"/>
    <circle cx="34" cy="245" r="10" fill="#6366f1"/>
    <text x="50" y="242" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Ethereum</text>
    <text x="50" y="254" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="8">ETH / USD</text>
    <text x="128" y="248" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">+8.1%</text>
    
    <rect x="25" y="280" width="140" height="32" rx="16" fill="url(#cardGrad2)"/>
    <text x="65" y="300" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Trade Now</text>
  </g>
</svg>
